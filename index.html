<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor del Proyecto - Demo Git</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .panel {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            width: 100%;
            max-width: 420px;
            padding: 1.8rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 0.8rem;
        }

        h1 {
            font-size: 1.1rem;
            color: #f8fafc;
            letter-spacing: 0.5px;
        }

        .badge {
            background-color: #3b82f6;
            color: #ffffff;
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
        }

        .status-box {
            background-color: #0f172a;
            border-left: 4px solid #22c55e;
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1.5rem;
        }

        .status-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 0.3rem;
        }

        .status-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #22c55e;
        }

        .info-list {
            list-style: none;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .info-list li {
            display: flex;
            justify-content: space-between;
            padding: 0.4rem 0;
            border-bottom: 1px dashed #334155;
        }

        .info-list li:last-child {
            border-bottom: none;
        }

        .label {
            color: #94a3b8;
        }

        footer {
            text-align: center;
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <main class="panel">
        <header>
            <h1>Mi Servidor Web</h1>
            <span class="badge">v1.0.0</span>
        </header>

        <section class="status-box">
            <div class="status-title">Estado actual</div>
            <div class="status-value">ONLINE</div>
        </section>

        <ul class="info-list">
            <li>
                <span class="label">Entorno:</span>
                <span>Desarrollo</span>
            </li>
            <li>
                <span class="label">Responsable:</span>
                <span>Alumno/a</span>
            </li>
            <li>
                <span class="label">Incidencias:</span>
                <span>0 abiertas</span>
            </li>
        </ul>

        <footer>
            Práctica inicial de Git y GitHub
        </footer>
    </main>

</body>
</html>
